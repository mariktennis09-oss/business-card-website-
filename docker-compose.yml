services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d card']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # Приложение стартует только после того, как база начала принимать
    # подключения: иначе migrate deploy упадёт на гонке при первом запуске.
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://card:card@db:5432/card?schema=public
      DIRECT_URL: postgresql://card:card@db:5432/card?schema=public
    ports:
      - '3000:3000'
    restart: on-failure:3
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
